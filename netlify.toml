[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # ✅ Production backend API URL — Render service
  # Update this if your Render service URL changes
  VITE_API_URL = "https://healtrack-mvs.onrender.com/api"

# SPA routing — all React routes work on Netlify
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
